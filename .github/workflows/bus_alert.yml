name: Morning Bus Notifier
on:
  workflow_dispatch:
    inputs:
      input_1:
        description: year
        required: true
        default: ''
        type: number
      input_2:
        description: month
        required: true
        default: ''
        type: number
      input_3:
        description: date
        required: true
        default: ''
        type: number
      input_4:
        description: hour
        required: true
        default: ''
