name: Morning Bus Notifier
on:
  workflow_dispatch:
    inputs:
      year:
        description: Custom Year
        required: true
        default: ''
        type: number
      month:
        description: Custom Month
        required: true
        default: ''
        type: number
      date:
        description: Custom Date
        required: true
        default: ''
        type: number
      hour:
        description: Custom Hour
        required: true
        default: ''
        type: number
      minute:
        description: Custom Minute
        required: true
        default: ''
        type: number
      second:
        description: Custom Second
        required: true
        default: ''
        type: number
  schedule:
  - cron: 55 0 * * 1-6
jobs:
  check_buses:
    runs-on: ubuntu-latest
    steps:
    - name: Get code from repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install requests library
      run: pip install curl_cffi
    - name: Run Bus Checker
      run: python notif.py
      env: 
        YEAR: ${{ inputs.year}}
        MONTH: ${{ inputs.month }}
        DATE: ${{ inputs.date }}
        HOUR: ${{ inputs.hour }}
        MINUTE: ${{ inputs.minute }}
        SECOND: ${{ inputs.second }}
    name: Check buses
