name: Morning Bus Notifier
on:
  workflow_dispatch:
    inputs:
      input_1:
        description: custom_date
        required: false
        default: ''
        type: string
      input_2:
        description: custom_time
        required: false
        default: ''
        type: string
  schedule:
  - cron: 55 0 * * 1-6
jobs:
  check_buses:
    runs-on: ubuntu-latest
    steps:
    - name: Get code from repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install requests library
      run: pip install curl_cffi
    - name: Run Bus Checker
      run: python notif.py
      env: 
        CUSTOM_DATE: ${{ inputs.custom_date }}
        CUSTOM_TIME: ${{ inputs.custom_time }}
    name: Check buses
